<main class="demo">
  <h1>Hello, {{ title() }}</h1>
  <p>Angular port of react-odontogram — click teeth to select them.</p>

  <div class="demo-chart">
    <ng-odontogram
      [defaultSelected]="['teeth-11', 'teeth-21']"
      (selectionChange)="onSelectionChange($event)"
    />
  </div>

  <pre class="demo-output">{{ selectedTeeth() | json }}</pre>
</main>
